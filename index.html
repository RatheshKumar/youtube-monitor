<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #eee;
            --header: #ff0000;
            --pulse: #ff4444;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        header {
            background: var(--header);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.8em;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 20px auto;
            gap: 20px;
        }

        .left {
            flex: 1;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .right {
            flex: 2;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            position: relative;
            transition: 0.3s;
        }

            .card.flip {
                transform: rotateY(180deg);
            }

            .card .label {
                font-size: 0.9em;
                color: #aaa;
            }

            .card .value {
                font-size: 1.5em;
                font-weight: bold;
                margin-top: 5px;
                background: #333;
                padding: 5px 0;
                border-radius: 5px;
            }

        .pulse {
            animation: pulseAnim 0.8s;
        }

        @keyframes pulseAnim {
            0% {
                background: #333;
            }

            50% {
                background: var(--pulse);
            }

            100% {
                background: #333;
            }
        }

        canvas {
            background: var(--card-bg);
            border-radius: 10px;
        }

        .search {
            display: flex;
            gap: 0;
        }

            .search input {
                flex: 1;
                padding: 10px;
                border-radius: 5px 0 0 5px;
                border: none;
            }

            .search button {
                padding: 10px;
                border-radius: 0 5px 5px 0;
                border: none;
                background: var(--header);
                color: white;
                cursor: pointer;
            }
    </style>
</head>
<body>

    <header>YouTube Realtime Dashboard</header>

    <div class="container">
        <div class="left">
            <div class="search">
                <input id="channelInput" placeholder="Enter channel name or URL">
                <button id="searchBtn">Search</button>
            </div>

            <div class="cards">
                <div class="card" id="cardTitle"><div class="label">Title</div><div id="title" class="value">-</div></div>
                <div class="card" id="cardSubs"><div class="label">Subscribers</div><div id="subscribers" class="value">-</div></div>
                <div class="card" id="cardViews"><div class="label">Views</div><div id="views" class="value">-</div></div>
                <div class="card" id="cardVideos"><div class="label">Videos</div><div id="videos" class="value">-</div></div>
            </div>
        </div>

        <div class="right">
            <canvas id="subChart" height="100"></canvas>
            <canvas id="viewsChart" height="100"></canvas>
            <canvas id="videosChart" height="100"></canvas>
        </div>
    </div>

    <script>
        let lastStats = {}, channel = "", timer;
        let timeLabels = [], subData = [], viewsData = [], videosData = [];

        // Charts
        const subChart = new Chart(document.getElementById('subChart').getContext('2d'), { type: 'line', data: { labels: timeLabels, datasets: [{ label: 'Subscribers', data: subData, borderColor: '#ff4444', fill: false }] }, options: { responsive: true } });
        const viewsChart = new Chart(document.getElementById('viewsChart').getContext('2d'), { type: 'line', data: { labels: timeLabels, datasets: [{ label: 'Views', data: viewsData, borderColor: '#44f', fill: false }] }, options: { responsive: true } });
        const videosChart = new Chart(document.getElementById('videosChart').getContext('2d'), { type: 'line', data: { labels: timeLabels, datasets: [{ label: 'Videos', data: videosData, borderColor: '#4f4', fill: false }] }, options: { responsive: true } });

        function updateCard(id, oldVal, newVal) {
            const el = document.getElementById(id.toLowerCase());
            el.classList.add('pulse'); setTimeout(() => el.classList.remove('pulse'), 800);
            el.textContent = newVal.toLocaleString();
        }

        // Fetch stats
        async function fetchStats() {
            if (!channel) return;
            try {
                const res = await fetch(`/api/stats?channel=${encodeURIComponent(channel)}`);
                const data = await res.json(); if (data.error) return;
                document.getElementById('title').textContent = data.title;
                updateCard('Subs', lastStats.subscribers || 0, data.subscribers);
                updateCard('Views', lastStats.views || 0, data.views);
                updateCard('Videos', lastStats.videos || 0, data.videos);

                const now = new Date().toLocaleTimeString();
                timeLabels.push(now); if (timeLabels.length > 20) { timeLabels.shift(); subData.shift(); viewsData.shift(); videosData.shift(); }
                subData.push(data.subscribers); viewsData.push(data.views); videosData.push(data.videos);
                subChart.update(); viewsChart.update(); videosChart.update();

                lastStats = data;
            } catch (e) { console.error(e); }
        }

        // Search button
        document.getElementById('searchBtn').addEventListener('click', () => {
            const input = document.getElementById('channelInput').value.trim();
            if (!input) return alert('Enter channel name or URL');
            channel = input; fetchStats();
            if (timer) clearInterval(timer); timer = setInterval(fetchStats, 15000);
        });
    </script>
</body>
</html>
